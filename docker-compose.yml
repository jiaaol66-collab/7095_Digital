services:
  # # 1. MongoDB (for storing user comment texts) MAINLY FOR PHASE 1.
  # mongodb:
  #   image: mongo:6.0
  #   container_name: mongodb_server
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo_data:/data/db
  #   networks:
  #     - ecommerce_network

  # 2. Hadoop HDFS (for storing structured product specifications and Parquet data lake)
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
    env_file:
      - ./hadoop.env
    networks:
      - ecommerce_network

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    env_file:
      - ./hadoop.env
    networks:
      - ecommerce_network

  # 3. Apache Spark (for data cleaning and aggregation)
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark_master
    ports:
      - "8080:8080"
      - "7077:7077"
    command: bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - ecommerce_network

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark_worker
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=6
      - SPARK_WORKER_MEMORY=10g
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - ecommerce_network

# 4. JupyterLab (Pure Linux Analytics Environment)
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: jupyter_analytics
    ports:
      - "8888:8888"
      - "4040:4040" # Spark UI port
    volumes:
      # This mounts your current Windows project folder into the Linux container
      - ./:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
    user: root
    networks:
      - ecommerce_network

  
volumes:
  #mongo_data:
  hadoop_namenode:
  hadoop_datanode:

networks:
  ecommerce_network:
    driver: bridge